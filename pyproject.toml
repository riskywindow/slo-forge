[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sloforge"
version = "0.1.0"
description = "SLO-driven inference deployment compiler and adaptive runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SLOForge contributors" }]
keywords = ["inference", "llm-serving", "slo", "systems", "optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
profile = ["psutil>=6.1,<8"]
models = ["scikit-learn>=1.6,<2"]
gpu-transformers = [
  "fastapi>=0.116,<1",
  "torch>=2.11,<2.14",
  "transformers>=5.4,<6",
  "uvicorn>=0.35,<1",
]
gpu-vllm = ["vllm>=0.9,<0.24"]
gpu-sglang = ["sglang>=0.4.6,<0.6"]
helix-training = [
  "peft>=0.19.1,<1",
  "torch>=2.11,<2.14",
  "transformers>=5.4,<6",
]
dev = [
  "cryptography>=44,<51",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0",
]
deploy = [
  "modal==1.5.3",
  "truss==0.18.24",
]

[project.scripts]
sloforge = "sloforge.cli.main:app"

[project.urls]
Documentation = "https://github.com/sloforge/sloforge/tree/main/docs"
Issues = "https://github.com/sloforge/sloforge/issues"
Repository = "https://github.com/sloforge/sloforge"

[tool.hatch.build.targets.wheel]
packages = ["python/sloforge"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: requires an NVIDIA GPU",
  "continuum_gpu: exercises the version-gated Continuum PyTorch CUDA converter",
  "expensive: long-running performance evaluation",
  "docker: requires a running Docker daemon",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python"
packages = ["sloforge"]
