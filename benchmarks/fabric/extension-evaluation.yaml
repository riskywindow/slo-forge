schema_version: sloforge.fabric.evaluation-matrix/v1
mode: synthetic_cpu
command: >-
  PYTHONPATH=python python -m sloforge.fabric.evaluation
  --artifact-dir artifacts/fabric/evaluation --report-dir reports --reset
seeds: [13, 29, 47]
topologies:
  - two_node_infiniband
  - two_node_asymmetric_nvlink
  - two_node_oversubscribed
  - two_node_degraded_network
workload_regimes:
  - mixed_bursty
  - long_context
  - expert_skewed
methods:
  - random_placement
  - sequential_placement
  - topology_unaware_optimizer
  - topology_aware_greedy
  - hierarchical_compiler
parallelism_control:
  tensor_parallel_degree: 8
  pipeline_parallel_degree: 1
  data_parallel_degree: 2
  expert_parallel_degree: 4
hypotheses:
  H1: topology-aware physical placement across favorable, asymmetric, oversubscribed, and degraded topologies and mixed, long-context, and expert-skewed workloads
  H2: calibrated digital-twin ranking with error grouped by topology, workload, message size, and contention plus Pareto-selection regret
  H3: causal diagnosis of network degradation and rank skew
  H4: diagnosis-driven recovery against generic baselines
statistics:
  confidence_level: 0.95
  bootstrap_repetitions: 1000
  aggregation: median
safety:
  requires_gpu: false
  requires_network_privilege: false
  creates_cloud_resources: false
  simulator_timeout_seconds: 60
provenance:
  fixture_curves_are_measurements: false
  hardware_backed_results_expected: false
