[workspace]
resolver = "2"
members = [
  "crates/sloforge-protocol",
  "crates/sloforge-sim",
  "crates/sloforge-loadgen",
  "crates/sloforge-telemetry",
  "crates/sloforge-gateway",
  "crates/sloforge-fabric-protocol",
  "crates/sloforge-fabric-sim",
  "crates/sloforge-genesis-ir",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/sloforge/sloforge"

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = { version = "0.8.7", features = ["http2", "json", "macros"] }
bytes = "1.11.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
http = "1.4.0"
http-body-util = "0.1.3"
proptest = "1.9.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = { version = "1.1.0", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full", "test-util"] }
tokio-stream = "0.1.17"
tower = { version = "0.5.2", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "cors", "request-id", "trace"] }
tracing = "0.1.43"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
